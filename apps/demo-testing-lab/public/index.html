<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Testing Lab — Test IO Agent Studio</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 46, 0.85);
      --card-border: rgba(70, 90, 140, 0.25);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header {
      background: rgba(13, 17, 30, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .logo { font-size: 1.25rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; cursor: pointer; }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); }

    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .mode-badge { padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
    .mode-buggy { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .mode-fixed { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }

    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }

    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

    .banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2) 0%, rgba(147, 51, 234, 0.2) 100%);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.75rem;
      margin-bottom: 2rem;
      position: relative;
    }
    .banner h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .banner p { color: var(--text-muted); font-size: 0.95rem; }

    .filter-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 250px; padding: 0.6rem 1rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 0.5rem; color: var(--text); }
    .sort-select { padding: 0.6rem 1rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 0.5rem; color: var(--text); }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); }
    .product-img { width: 100%; height: 160px; background: #1e293b; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .product-title { font-size: 1.1rem; font-weight: 600; }
    .product-price { font-size: 1.25rem; font-weight: 700; color: #60a5fa; }
    .product-desc { color: var(--text-muted); font-size: 0.85rem; flex: 1; }

    /* Cart Drawer Modal */
    .cart-drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 400px; height: 100vh;
      background: #111827;
      border-left: 1px solid var(--card-border);
      z-index: 100;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.6);
      transition: right 0.3s ease;
    }
    .cart-drawer.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: rgba(255, 255, 255, 0.03); border-radius: 0.5rem; }
    .cart-footer { border-top: 1px solid var(--card-border); padding-top: 1rem; margin-top: 1rem; }
    .cart-summary-line { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 1.1rem; font-weight: 700; }

    /* Bug Controls Panel */
    .bug-panel {
      margin-top: 3rem;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.5rem;
    }
    .bug-panel h3 { margin-bottom: 1rem; color: #93c5fd; }
    .bug-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; }
    .bug-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }

    .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 90; display: none; }
    .backdrop.open { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>🛡️</span> Test IO Demo Lab
    </div>
    <nav class="nav-links">
      <a id="nav-products" class="active" onclick="switchTab('products')">Products</a>
      <a id="nav-checklist" onclick="switchTab('checklist')">Checklist</a>
      <a id="nav-settings" onclick="switchTab('settings')">Settings</a>
    </nav>
    <div class="header-actions">
      <span id="build-badge" class="mode-badge mode-buggy">BUGGY BUILD</span>
      <button id="toggle-build-btn" class="btn btn-outline" onclick="toggleBuildMode()">Switch to Fixed Build</button>
      <button id="cart-button" data-testid="cart-button" class="btn btn-primary" onclick="openCart()">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <main>
    <div class="banner">
      <h1 id="banner-title">Authorized QA Testing Environment</h1>
      <p id="banner-desc">Real synthetic test target for Test IO Agent Studio. Contains 10 toggleable intentional bugs.</p>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search products..." oninput="handleSearch()">
      <select id="sort-select" class="sort-select" onchange="handleSort()">
        <option value="default">Sort by: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </div>

    <div id="product-container" class="product-grid">
      <!-- Injected via JS -->
    </div>

    <!-- Bug Controls Reference -->
    <div class="bug-panel">
      <h3>Active Intentional Bugs Diagnostic State</h3>
      <div id="bug-grid" class="bug-grid">
        <!-- Injected via JS -->
      </div>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div id="cart-backdrop" class="backdrop" onclick="closeCart()"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <button class="btn btn-outline" onclick="closeCart()">✕</button>
    </div>
    <div id="cart-items" class="cart-items">
      <p id="empty-cart-msg" style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-summary-line">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button id="checkout-button" data-testid="checkout-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="handleCheckout()">
        Proceed to Checkout
      </button>
    </div>
  </aside>

  <script>
    const PRODUCTS = [
      { id: 1, name: "Mechanical Gaming Keyboard", price: 29.99, icon: "⌨️", desc: "RGB backlit mechanical keyboard with blue switches." },
      { id: 2, name: "Wireless Ergonomic Mouse", price: 49.99, icon: "🖱️", desc: "Precision optical sensor with customizable DPI levels." },
      { id: 3, name: "Noise Cancelling Headset", price: 89.99, icon: "🎧", desc: "Premium studio sound quality with active noise cancellation." },
      { id: 4, name: "Ultra-Wide Gaming Monitor", price: 249.99, icon: "🖥️", desc: "144Hz refresh rate, 1ms response time HDR display." }
    ];

    let currentProducts = [...PRODUCTS];
    let cart = [];
    let config = {
      buildMode: 'BUGGY_BUILD',
      bugs: {
        BUG_CART_TOTAL_CALCULATION: true,
        BUG_EMAIL_VALIDATION_REGEX: true,
        BUG_REQUIRED_FIELD_BYPASS: true,
        BUG_SORT_PRICE_INVERTED: true,
        BUG_SEARCH_MISSING_RESULTS: true,
        BUG_CHECKOUT_BUTTON_UNRESPONSIVE: true,
        BUG_NAV_TAB_MISMATCH: true,
        BUG_TEXT_OVERFLOW: true,
        BUG_FORM_SUBMIT_WRONG_STATE: true,
        BUG_MOCK_CHATBOT_RULE_FAIL: true
      }
    };

    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = currentProducts.map(p => `
        <div class="product-card" data-testid="product-${p.id}">
          <div class="product-img">${p.icon}</div>
          <div class="product-title">${p.name}</div>
          <div class="product-desc">${p.desc}</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto;">
            <span class="product-price">$${p.price.toFixed(2)}</span>
            <button id="add-btn-${p.id}" data-testid="add-to-cart-${p.id}" class="btn btn-primary" onclick="addToCart(${p.id})">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderBugDiagnostic() {
      const grid = document.getElementById('bug-grid');
      grid.innerHTML = Object.entries(config.bugs).map(([k, v]) => `
        <div class="bug-item">
          <span>${v ? '🔴' : '🟢'}</span>
          <span>${k}: <b>${v ? 'BUGGY' : 'FIXED'}</b></span>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      cart.push(product);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').textContent = cart.length;
      const itemsContainer = document.getElementById('cart-items');

      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p id="empty-cart-msg" style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>';
        document.getElementById('cart-total').textContent = '$0.00';
        return;
      }

      itemsContainer.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div>
            <div style="font-weight: 600;">${item.name}</div>
            <div style="color: var(--text-muted); font-size: 0.85rem;">$${item.price.toFixed(2)}</div>
          </div>
          <button class="btn btn-outline" style="padding: 0.2rem 0.5rem;" onclick="removeFromCart(${idx})">✕</button>
        </div>
      `).join('');

      // CALCULATE TOTAL:
      let total = 0;
      if (config.bugs.BUG_CART_TOTAL_CALCULATION) {
        // DELIBERATE INTENTIONAL BUG 1:
        // Instead of summing prices, it only takes the price of the first item!
        total = cart.length > 0 ? cart[0].price : 0;
      } else {
        // FIXED BEHAVIOR:
        total = cart.reduce((sum, item) => sum + item.price, 0);
      }

      document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function openCart() {
      document.getElementById('cart-drawer').classList.add('open');
      document.getElementById('cart-backdrop').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('open');
      document.getElementById('cart-backdrop').classList.remove('open');
    }

    function handleCheckout() {
      if (config.bugs.BUG_CHECKOUT_BUTTON_UNRESPONSIVE) {
        // Intentional Bug: unresponsiveness
        console.warn("BUG: Checkout button unresponsive in BUGGY_BUILD");
        return;
      }
      alert("Order placed successfully!");
    }

    function handleSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      if (config.bugs.BUG_SEARCH_MISSING_RESULTS && q.length > 0) {
        // Intentional Bug: search fails to return matching items
        currentProducts = [];
      } else {
        currentProducts = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
      }
      renderProducts();
    }

    function handleSort() {
      const val = document.getElementById('sort-select').value;
      if (val === 'price-asc') {
        if (config.bugs.BUG_SORT_PRICE_INVERTED) {
          // Intentional Bug: sorts in reverse order
          currentProducts.sort((a, b) => b.price - a.price);
        } else {
          currentProducts.sort((a, b) => a.price - b.price);
        }
      } else if (val === 'price-desc') {
        if (config.bugs.BUG_SORT_PRICE_INVERTED) {
          currentProducts.sort((a, b) => a.price - b.price);
        } else {
          currentProducts.sort((a, b) => b.price - a.price);
        }
      }
      renderProducts();
    }

    function switchTab(tab) {
      if (config.bugs.BUG_NAV_TAB_MISMATCH && tab === 'settings') {
        // Intentional Bug: nav tab mismatch
        alert("Navigated to Products due to tab mismatch bug!");
        return;
      }
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
      const activeEl = document.getElementById(`nav-${tab}`);
      if (activeEl) activeEl.classList.add('active');
    }

    function toggleBuildMode() {
      const nextMode = config.buildMode === 'BUGGY_BUILD' ? 'FIXED_BUILD' : 'BUGGY_BUILD';
      fetch('/api/set-build', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: nextMode })
      }).then(() => {
        config.buildMode = nextMode;
        const isBuggy = nextMode === 'BUGGY_BUILD';
        for (const k of Object.keys(config.bugs)) config.bugs[k] = isBuggy;
        updateBuildBadge();
        updateCartUI();
        renderBugDiagnostic();
      });
    }

    function updateBuildBadge() {
      const badge = document.getElementById('build-badge');
      const btn = document.getElementById('toggle-build-btn');
      if (config.buildMode === 'BUGGY_BUILD') {
        badge.textContent = 'BUGGY BUILD';
        badge.className = 'mode-badge mode-buggy';
        btn.textContent = 'Switch to Fixed Build';
      } else {
        badge.textContent = 'FIXED BUILD';
        badge.className = 'mode-badge mode-fixed';
        btn.textContent = 'Switch to Buggy Build';
      }
    }

    // Initial render
    renderProducts();
    renderBugDiagnostic();
    updateBuildBadge();
  </script>
</body>
</html>
